# Local Docker validation only — Railway uses managed PostgreSQL + Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fulani
      POSTGRES_PASSWORD: fulani
      POSTGRES_DB: fulastrapi
    ports:
      - "5433:5432"
    volumes:
      - fulani_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulani -d fulastrapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: http://localhost:1337
      FRONTEND_URL: http://localhost:3000
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: fulastrapi
      DATABASE_USERNAME: fulani
      DATABASE_PASSWORD: fulani
      DATABASE_SSL: "false"
      APP_KEYS: localKey1,localKey2,localKey3,localKey4
      API_TOKEN_SALT: localApiTokenSaltChangeMe
      ADMIN_JWT_SECRET: localAdminJwtSecretChangeMe
      JWT_SECRET: localJwtSecretChangeMe
      TRANSFER_TOKEN_SALT: localTransferTokenSaltChangeMe
      ENCRYPTION_KEY: localEncryptionKeyChangeMe32b
      MASTER_KEY: localMasterKeyChangeMeForDevOnly
    volumes:
      - fulani_uploads:/opt/app/public/uploads

volumes:
  fulani_pg_data:
  fulani_uploads:
